<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SKIP · encrypted messenger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#09090b;
  --card:#14141a;
  --card2:#1c1c24;
  --border:#2a2a32;
  --border2:#3a3a44;
  --cyan:#00f5d4;
  --cyan2:#00bfa5;
  --mag:#ff3b6f;
  --gold:#ffd966;
  --text:#ededee;
  --muted:#6b6b7a;
  --muted2:#3f3f4a;
  --r:14px;
  --r2:24px;
  --font-sans:'Inter',system-ui,-apple-system,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);height:100vh;overflow:hidden;font-size:14px;}
.grain{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(45deg,rgba(255,255,255,0.01) 0px,rgba(255,255,255,0.01) 2px,transparent 2px,transparent 8px);z-index:9998;}
#authBg{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .5s ease;}
.glow-bg{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(0,245,212,0.08) 0%,transparent 60%);}
.acard{position:relative;width:100%;max-width:420px;background:rgba(20,20,26,0.9);backdrop-filter:blur(20px);border:1px solid rgba(0,245,212,0.2);border-radius:24px;padding:40px 32px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);}
.acard::before{content:'';position:absolute;inset:0;border-radius:24px;background:linear-gradient(135deg,rgba(0,245,212,0.05) 0%,transparent 70%);pointer-events:none;}
.alogo{font-family:'Syne',sans-serif;font-size:52px;font-weight:800;letter-spacing:-2px;background:linear-gradient(135deg,#00f5d4,#ff3b6f);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;margin-bottom:8px;}
.atag{font-size:11px;color:var(--muted);text-align:center;letter-spacing:2px;text-transform:uppercase;margin-bottom:32px;}
.tabs{display:flex;gap:8px;margin-bottom:28px;background:var(--card2);border-radius:60px;padding:4px;}
.tbtn{flex:1;padding:10px;border:none;background:transparent;color:var(--muted);font-family:var(--font-sans);font-weight:500;font-size:14px;cursor:pointer;border-radius:60px;transition:all .2s;}
.tbtn.on{background:var(--cyan);color:#09090b;font-weight:600;box-shadow:0 2px 8px rgba(0,245,212,0.3);}
.fi{width:100%;padding:14px 16px;margin-bottom:12px;background:var(--card2);border:1px solid var(--border);border-radius:14px;color:var(--text);font-family:var(--font-sans);font-size:14px;outline:none;transition:all .2s;}
.fi:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,245,212,0.1);}
.asub{width:100%;padding:14px;margin-top:8px;background:linear-gradient(135deg,var(--cyan),var(--cyan2));border:none;border-radius:14px;color:#09090b;font-family:var(--font-sans);font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;}
.asub:hover{opacity:0.9;transform:translateY(-1px);}
.amsg{margin-top:12px;text-align:center;font-size:12px;min-height:18px;}
.app{display:flex;height:100vh;opacity:0;transition:opacity .4s;}
.app.on{opacity:1}
.sidebar{width:280px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s cubic-bezier(0.2,0.9,0.4,1.1);z-index:10;}
.sbtop{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,var(--cyan),var(--mag));display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-weight:700;font-size:18px;color:#09090b;flex-shrink:0;overflow:hidden;cursor:pointer;}
.avatar-img{width:100%;height:100%;object-fit:cover;}
.unm{font-weight:700;font-size:14px;}
.usb{font-size:10px;color:var(--cyan);margin-top:2px;}
.newbtn{margin:8px 12px;padding:10px;background:rgba(0,245,212,0.08);border:1px solid rgba(0,245,212,0.2);border-radius:40px;color:var(--cyan);font-family:var(--font-sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;}
.newbtn:hover{background:rgba(0,245,212,0.15);border-color:var(--cyan);}
.sbbody{flex:1;overflow-y:auto;padding:8px;}
.sbbody::-webkit-scrollbar{width:4px}
.sbbody::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.chat-item{padding:10px;border-radius:12px;cursor:pointer;margin-bottom:2px;transition:all .15s;display:flex;align-items:center;gap:10px;position:relative;}
.chat-item:hover{background:rgba(255,255,255,0.03);}
.chat-item.active{background:rgba(0,245,212,0.08);border-left:2px solid var(--cyan);}
.chat-avatar{width:40px;height:40px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;overflow:hidden;}
.chat-info{flex:1;min-width:0;}
.chat-name{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;}
.chat-preview{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.chat-delete{opacity:0;background:rgba(255,59,111,0.2);border:none;color:var(--mag);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:14px;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.chat-item:hover .chat-delete{opacity:1;}
.chat-delete:hover{background:var(--mag);color:white;}
.chat{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0;}
.chtop{padding:12px 16px;background:rgba(9,9,11,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;z-index:2;}
.backbtn{display:none;width:36px;height:36px;border:1px solid var(--border2);border-radius:12px;background:transparent;color:var(--text);cursor:pointer;align-items:center;justify-content:center;}
.chat-header-avatar{width:40px;height:40px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;}
.chat-header-info{flex:1;cursor:pointer;}
.chat-header-info:hover .unm{color:var(--cyan);}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth;}
#msgs::-webkit-scrollbar{width:4px}
.msg{max-width:70%;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.own{align-self:flex-end}
.msg.oth{align-self:flex-start}
.msg-name{font-size:10px;font-weight:600;margin-bottom:3px;padding:0 4px;color:var(--muted);cursor:pointer;display:inline-block;}
.msg-name:hover{color:var(--cyan);text-decoration:underline;}
.msg.own .msg-name{color:var(--cyan);text-align:right;display:block;}
.msg-bubble{padding:8px 12px;border-radius:16px;font-size:13px;line-height:1.45;word-break:break-word;}
.msg.own .msg-bubble{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#09090b;border-bottom-right-radius:4px;}
.msg.oth .msg-bubble{background:var(--card2);border:1px solid var(--border);border-bottom-left-radius:4px;}
.msg-time{font-size:9px;color:var(--muted2);margin-top:3px;padding:0 4px;}
.msg.own .msg-time{text-align:right;}
.file-attachment{display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(0,0,0,0.2);border-radius:10px;margin-top:5px;cursor:pointer;}
.file-icon{font-size:20px;}
.file-name{font-size:11px;word-break:break-all;flex:1;}
.file-size{font-size:9px;color:var(--muted);}
.msg-image{max-width:200px;max-height:200px;border-radius:12px;margin-top:6px;cursor:pointer;object-fit:contain;background:var(--card2);}
.inrow{padding:12px 16px;background:rgba(9,9,11,0.85);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;}
#mi{flex:1;padding:10px 14px;background:var(--card2);border:1px solid var(--border);border-radius:40px;color:var(--text);font-family:var(--font-sans);font-size:13px;outline:none;}
#mi:focus{border-color:var(--cyan);}
.file-btn{width:38px;height:38px;background:var(--card2);border:1px solid var(--border);border-radius:40px;color:var(--cyan);cursor:pointer;font-size:18px;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.file-btn:hover{background:var(--border2);border-color:var(--cyan);}
#sbtn{width:38px;height:38px;background:var(--cyan);border:none;border-radius:40px;color:#09090b;cursor:pointer;font-size:16px;transition:all .2s;}
#sbtn:hover{transform:scale(1.03);}
.right-panel{width:260px;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s;}
.right-panel.hidden{display:none;}
.panel-header{padding:16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;}
.panel-content{flex:1;padding:20px;text-align:center;}
.panel-avatar{width:100px;height:100px;border-radius:50%;margin:0 auto 16px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;}
.panel-username{font-size:18px;font-weight:700;margin-bottom:8px;}
.panel-bio{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.panel-status{font-size:11px;color:var(--cyan);background:rgba(0,245,212,0.1);padding:5px 12px;border-radius:20px;display:inline-block;}
.sound-toggle{margin:8px 12px;padding:6px 12px;background:rgba(0,245,212,0.1);border:1px solid rgba(0,245,212,0.2);border-radius:20px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:11px;color:var(--cyan);}
.sound-toggle:hover{background:rgba(0,245,212,0.2);}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);z-index:500;align-items:center;justify-content:center;padding:20px;}
.modal.on{display:flex}
.mbox{background:var(--card);border:1px solid var(--border2);border-radius:24px;padding:24px;width:100%;max-width:380px;}
.mtitle{font-weight:700;font-size:18px;margin-bottom:20px;}
.minput{width:100%;padding:10px 14px;margin-bottom:14px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);outline:none;}
.minput:focus{border-color:var(--cyan);}
.mbtns{display:flex;gap:10px;}
.mbtns button{flex:1;padding:10px;border-radius:10px;font-weight:600;cursor:pointer;}
.mok{background:var(--cyan);color:#09090b;border:none;}
.mcancel{background:var(--card2);color:var(--muted);border:1px solid var(--border);}
.profile-avatar-lg{width:100px;height:100px;border-radius:50%;margin:0 auto 16px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;position:relative;cursor:pointer;}
.profile-avatar-lg:hover::after{content:'✏️';position:absolute;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;font-size:24px;}
.crop-container{margin:16px 0;background:var(--card2);border-radius:16px;padding:16px;}
.crop-canvas-container{position:relative;width:200px;height:200px;margin:0 auto;overflow:hidden;border-radius:50%;border:2px solid var(--cyan);cursor:move;}
#cropCanvas{position:absolute;top:0;left:0;cursor:grab;}
#cropCanvas:active{cursor:grabbing;}
.crop-controls{margin-top:16px;display:flex;flex-direction:column;gap:12px;}
.zoom-slider,.grid-toggle{display:flex;align-items:center;gap:12px;}
.zoom-slider label,.grid-toggle label{font-size:11px;color:var(--muted);width:50px;}
input[type="range"]{flex:1;height:3px;-webkit-appearance:none;background:var(--border);border-radius:2px;outline:none;}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cyan);cursor:pointer;}
.grid-toggle button{flex:1;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;font-size:10px;}
.grid-toggle button.active{background:var(--cyan);color:#09090b;border-color:var(--cyan);}
.crop-buttons{display:flex;gap:8px;margin-top:12px;}
.crop-buttons button{flex:1;padding:6px;border-radius:8px;cursor:pointer;font-weight:500;font-size:12px;}
.crop-save{background:var(--cyan);color:#09090b;border:none;}
.crop-cancel{background:var(--card2);border:1px solid var(--border);color:var(--muted);}
.hidden-file{display:none;}
.movl{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9;}
.image-viewer{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:2000;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.image-viewer img{max-width:90vw;max-height:90vh;object-fit:contain;}
@media(max-width:680px){.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);z-index:20;}.sidebar.mopen{transform:translateX(0)}.right-panel{position:fixed;right:0;top:0;bottom:0;z-index:20;background:var(--card);transform:translateX(100%);}.right-panel.open{transform:translateX(0)}.movl.on{display:block}.backbtn{display:flex}.msg{max-width:85%}}
.notif-toast{position:fixed;bottom:20px;left:20px;right:20px;max-width:300px;background:var(--card2);border-left:3px solid var(--cyan);border-radius:10px;padding:10px 14px;z-index:2000;backdrop-filter:blur(12px);box-shadow:0 10px 25px -5px rgba(0,0,0,0.3);animation:slideUp .3s ease;font-size:12px;}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="grain"></div>

<div id="authBg">
  <div class="glow-bg"></div>
  <div class="acard">
    <div class="alogo">SKIP</div>
    <div class="atag">private · encrypted</div>
    <div class="tabs"><button class="tbtn on" data-tab="login">вход</button><button class="tbtn" data-tab="register">регистрация</button></div>

    <div id="registerPanel" style="display:none"><input class="fi" id="regUsername" placeholder="username (латиница, цифры, _)"><input class="fi" id="regPassword" type="password" placeholder="пароль"><button class="asub" id="doRegBtn">создать →</button><div class="amsg" id="regMsg"></div></div>
  </div>
</div>

<div class="app" id="app">
  <div class="movl" id="movl"></div>
  <div class="sidebar" id="sidebar">
    <div class="sbtop"><div class="avatar" id="myAvatar">👤</div><div style="flex:1"><div class="unm" id="myUsername">—</div><div class="usb" id="myStatus">online</div></div><button id="settingsBtn" style="background:none;border:none;color:var(--cyan);font-size:18px;cursor:pointer;">⚙️</button></div>
    <button class="newbtn" id="newChatBtn">➕ новый чат</button>

    <div class="sbbody" id="chatList"></div>
  </div>
  <div class="chat">
    <div class="chtop"><button class="backbtn" id="backBtn">☰</button><div class="chat-header-avatar" id="chatAvatar">💬</div><div class="chat-header-info" id="chatHeaderInfo"><div class="unm" id="chatTitle">—</div><div class="usb" id="chatMeta">зашифровано</div></div></div>

  </div>
  <div class="right-panel hidden" id="rightPanel"><div class="panel-header">профиль собеседника<button id="closePanelBtn" style="float:right;background:none;border:none;color:var(--muted);cursor:pointer;">✕</button></div><div class="panel-content" id="panelContent"><div class="panel-avatar" id="panelAvatar">👤</div><div class="panel-username" id="panelUsername">—</div><div class="panel-bio" id="panelBio"></div><div class="panel-status" id="panelStatus"></div></div></div>
</div>

<div class="modal" id="profileModal"><div class="mbox"><div class="mtitle">профиль</div><div class="profile-avatar-lg" id="profileAvatarPreview" onclick="document.getElementById('avatarFile').click()">👤</div><input type="file" id="avatarFile" class="hidden-file" accept="image/jpeg,image/png,image/gif,image/webp"><div id="cropEditor" style="display:none"><div class="crop-container"><div class="crop-canvas-container" id="cropContainer"><canvas id="cropCanvas" width="400" height="400"></canvas></div><div class="crop-controls"><div class="zoom-slider"><label>🔍 масштаб</label><input type="range" id="zoomSlider" min="0.5" max="3" step="0.01" value="1"></div><div class="grid-toggle"><label>📐 сетка</label><button id="gridToggleBtn" class="active">вкл</button></div><div class="crop-buttons"><button class="crop-save" id="cropSaveBtn">✓ применить</button><button class="crop-cancel" id="cropCancelBtn">✗ отмена</button></div></div></div></div><input class="minput" id="profileUsername" placeholder="username"><input class="minput" id="profileBio" placeholder="о себе"><button class="asub" id="saveProfileBtn" style="margin-bottom:12px">сохранить</button><div id="profileMsg" style="font-size:11px;color:var(--muted);text-align:center"></div><div style="margin-top:14px"><button id="closeProfileBtn" style="width:100%;padding:10px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer">закрыть</button></div></div></div>
<div class="modal" id="newChatModal"><div class="mbox"><div class="mtitle">новый чат</div><input class="minput" id="targetUser" placeholder="@username собеседника"><div style="font-size:11px;color:var(--muted);margin-bottom:14px">введите точный username</div><div class="mbtns"><button class="mok" id="createChatConfirm">создать</button><button class="mcancel" id="cancelChatBtn">отмена</button></div></div></div>
<div class="modal" id="deleteChatModal"><div class="mbox"><div class="mtitle">⚠️ удалить чат?</div><div style="font-size:13px;color:var(--muted);margin-bottom:20px">Чат будет удалён у вас и у собеседника. Все сообщения будут потеряны безвозвратно.</div><div class="mbtns"><button class="mok" id="confirmDeleteBtn" style="background:var(--mag);color:white;">🗑️ удалить</button><button class="mcancel" id="cancelDeleteBtn">отмена</button></div></div></div>
<div class="modal" id="userProfileModal"><div class="mbox"><div class="mtitle" id="userProfileTitle">профиль пользователя</div><div style="text-align:center"><div class="profile-avatar-lg" id="userProfileAvatar">👤</div><div class="panel-username" id="userProfileUsername">—</div><div class="panel-bio" id="userProfileBio" style="margin-top:12px"></div></div><div style="margin-top:20px"><button id="closeUserProfileBtn" class="mcancel" style="width:100%">закрыть</button></div></div></div>

<script>
// Разбитый токен
const TOKEN = 'ghp_' + 'KARUAB' + '62R0V7' + 'TkGTvB' + 'xPzCpp' + 'oHcztk' + '3Gee2m';

const GIST_ID = '3c13a9018358fc6dd01e0ec2df85f740';
const USERS_GIST = 'd0ff1e8a01417e7931279eb563198dba';
const MAX_FILE_SIZE = 25 * 1024 * 1024;

let currentUser = null;
let currentChatSeed = null;
let currentChatPartner = null;
let chats = [];
let messagesCache = new Map();
let pollInterval = null;
let userUpdateInterval = null;
let soundEnabled = true;
let deleteChatCallback = null;
let cropState = { img: null, zoom: 1, panX: 0, panY: 0, showGrid: true };
let cropCanvas = null, cropCtx = null;
let usersCache = new Map();

function $(id) { return document.getElementById(id); }
function esc(s) { if(!s) return ''; return s.replace(/[&<>]/g, function(m) { if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }
function showToast(msg) { let t=document.createElement('div'); t.className='notif-toast'; t.innerHTML=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
function formatFileSize(bytes){ if(bytes<1024) return bytes+' B'; if(bytes<1048576) return (bytes/1024).toFixed(1)+' KB'; return (bytes/1048576).toFixed(1)+' MB'; }

function playNotificationSound() {
  if(!soundEnabled) return;
  try {
    let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let oscillator = audioCtx.createOscillator();
    let gainNode = audioCtx.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.type = 'sine';
    oscillator.frequency.value = 880;
    gainNode.gain.value = 0.12;
    oscillator.start();
    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
    oscillator.stop(audioCtx.currentTime + 0.3);
    if(audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e) { console.log('audio error'); }
}

async function gistGet(id) { let r=await fetch(`https://api.github.com/gists/${id}?t=${Date.now()}`,{headers:{Authorization:`token ${TOKEN}`}}); if(!r.ok) throw new Error(); return r.json(); }
async function gistPatch(id,files) { let r=await fetch(`https://api.github.com/gists/${id}`,{method:'PATCH',headers:{Authorization:`token ${TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({files})}); if(!r.ok) throw new Error(); return r.json(); }
async function loadUsers() { let d=await gistGet(USERS_GIST); let f=d.files['users.json']; let users = f?.content?JSON.parse(f.content):[]; users.forEach(u=>usersCache.set(u.username,u)); return users; }
async function saveUsers(users) { await gistPatch(USERS_GIST,{'users.json':{content:JSON.stringify(users,null,2)}}); users.forEach(u=>usersCache.set(u.username,u)); }

async function checkForNewChats() {
  if(!currentUser) return;
  let users = await loadUsers();
  let currentUserData = users.find(u => u.username === currentUser.username);
  if(currentUserData && currentUserData.chats) {
    let needUpdate = false;
    for(let newChat of currentUserData.chats) {
      if(!chats.find(c => c.seed === newChat.seed)) {
        chats.push(newChat);
        needUpdate = true;
        playNotificationSound();
        showToast(`📩 новый чат: ${newChat.name}`);
      }
    }
    if(needUpdate) {
      for(let chat of chats) {
        if(chat.partner) {
          let partnerData = usersCache.get(chat.partner);
          if(partnerData && partnerData.avatar && partnerData.avatar !== chat.avatarUrl) {
            chat.avatarUrl = partnerData.avatar;
          }
        }
      }
      renderChatList();
      await saveUserData();
    }
  }
}

function generateSeed() { let chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!()_+-=[]{};:,.<>?'; let res=''; for(let i=0;i<32;i++) res+=chars[Math.floor(Math.random()*chars.length)]; return res; }
function encrypt(text,seed) { return CryptoJS.AES.encrypt(text,seed).toString(); }
function decrypt(enc,seed) { try { return CryptoJS.AES.decrypt(enc,seed).toString(CryptoJS.enc.Utf8); } catch(e) { return null; } }

async function loadMessages(seed) { 
  let fname=`chat_${CryptoJS.SHA256(seed).toString().slice(0,16)}.txt`; 
  try { 
    let data=await gistGet(GIST_ID); 
    let content=data.files[fname]?.content||''; 
    let lines=content.split('\n').filter(l=>l.trim()); 
    let msgs=[]; 
    for(let line of lines) { 
      let dec=decrypt(line,seed); 
      if(dec) msgs.push(dec); 
    } 
    return msgs; 
  } catch(e) { return []; } 
}

async function saveMessage(seed, msgText) { 
  let fname=`chat_${CryptoJS.SHA256(seed).toString().slice(0,16)}.txt`; 
  let data=await gistGet(GIST_ID); 
  let old=data.files[fname]?.content||''; 
  let enc=encrypt(msgText,seed); 
  let newContent=old+(old?'\n':'')+enc; 
  await gistPatch(GIST_ID,{[fname]:{content:newContent}}); 
}

async function sendFile(file) {
  if(!currentChatSeed) return;
  if(file.size > MAX_FILE_SIZE) { showToast(`❌ Файл больше ${MAX_FILE_SIZE/1024/1024}MB`); return; }
  
  let reader = new FileReader();
  reader.onload = async (e) => {
    let fileData = e.target.result;
    let isImage = file.type.startsWith('image/');
    
    // Сохраняем сообщение с данными файла (зашифрованное)
    let fileMsgData = {
      type: 'file',
      name: file.name,
      size: file.size,
      mime: file.type,
      data: fileData,
      isImage: isImage
    };
    let fullMsg = `${currentUser.username}: 🖼️📎 ${isImage ? 'Изображение' : 'Файл'}: ${file.name} (${formatFileSize(file.size)})`;
    let dataMsg = `${currentUser.username}: [FILE_DATA]${JSON.stringify(fileMsgData)}`;
    
    await saveMessage(currentChatSeed, fullMsg);
    await saveMessage(currentChatSeed, dataMsg);
    
    let msgs = await loadMessages(currentChatSeed);
    messagesCache.set(currentChatSeed, msgs);
    renderMessages(currentChatSeed);
    
    let chat = chats.find(c=>c.seed===currentChatSeed);
    if(chat) { 
      chat.lastMsg = `${isImage ? '🖼️' : '📎'} ${file.name}`; 
      chat.lastSeen=Date.now(); 
      await saveUserData(); 
      renderChatList(); 
    }
  };
  reader.readAsDataURL(file);
}

async function sendMsg() { 
  if(!currentChatSeed) return; 
  let inp=$('mi'); 
  let txt=inp.value.trim(); 
  if(!txt) return; 
  let full=`${currentUser.username}: ${txt}`; 
  await saveMessage(currentChatSeed,full); 
  inp.value=''; 
  let msgs=await loadMessages(currentChatSeed); 
  messagesCache.set(currentChatSeed,msgs); 
  renderMessages(currentChatSeed); 
  let chat=chats.find(c=>c.seed===currentChatSeed); 
  if(chat) { 
    chat.lastMsg=txt; 
    chat.lastSeen=Date.now(); 
    await saveUserData(); 
    renderChatList(); 
  } 
}

function renderMessages(seed) {
  let container=$('msgs'); 
  let msgs=messagesCache.get(seed)||[];
  if(!msgs.length) { 
    container.innerHTML='<div style="text-align:center;opacity:0.5;padding:40px">✉️ нет сообщений</div>'; 
    return; 
  }
  container.innerHTML='';
  
  for(let i=0; i<msgs.length; i++) {
    let raw = msgs[i];
    let idx=raw.indexOf(':'); 
    let sender=idx>0?raw.slice(0,idx):'?'; 
    let text=idx>0?raw.slice(idx+2):raw;
    let own=sender===currentUser.username;
    
    // Пропускаем сообщения с данными файлов (они обрабатываются отдельно)
    if(text.startsWith('[FILE_DATA]')) continue;
    
    // Пропускаем короткие сообщения-превью файлов (чтобы не было дублирования)
    if(text.startsWith('🖼️📎') || text.startsWith('🖼️') && text.includes('Изображение')) continue;
    
    let div=document.createElement('div'); 
    div.className=`msg ${own?'own':'oth'}`;
    
    // Обычное текстовое сообщение
    div.innerHTML = `<div class="msg-name" onclick="showUserProfile('${esc(sender)}')">${esc(sender)}</div>
      <div class="msg-bubble">${esc(text)}</div>
      <div class="msg-time">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
    container.appendChild(div);
  }
  
  // Отдельно обрабатываем файловые сообщения (ищем во всех сообщениях)
  for(let raw of msgs) {
    let idx=raw.indexOf(':'); 
    let sender=idx>0?raw.slice(0,idx):'?'; 
    let text=idx>0?raw.slice(idx+2):raw;
    let own=sender===currentUser.username;
    
    let fileMatch = text.match(/^\[FILE_DATA\](.*)/);
    if(fileMatch) {
      try {
        let fd = JSON.parse(fileMatch[1]);
        let div = document.createElement('div'); 
        div.className=`msg ${own?'own':'oth'}`;
        
        if(fd.isImage) {
          div.innerHTML = `<div class="msg-name" onclick="showUserProfile('${esc(sender)}')">${esc(sender)}</div>
            <div class="msg-bubble">
              <img src="${fd.data}" class="msg-image" onclick="showImageFullscreen('${fd.data}')">
              <div class="msg-time">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
            </div>`;
        } else {
          div.innerHTML = `<div class="msg-name" onclick="showUserProfile('${esc(sender)}')">${esc(sender)}</div>
            <div class="msg-bubble">
              <div class="file-attachment" onclick="downloadFile('${fd.data}','${fd.name}')">
                <div class="file-icon">📄</div>
                <div class="file-name">${esc(fd.name)}</div>
                <div class="file-size">${formatFileSize(fd.size)}</div>
              </div>
              <div class="msg-time">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
            </div>`;
        }
        container.appendChild(div);
      } catch(e) { console.log('file parse error', e); }
    }
  }
  container.scrollTop = container.scrollHeight;
}

async function selectChat(seed) {
  if(currentChatSeed===seed) return; 
  currentChatSeed=seed;
  let chat=chats.find(c=>c.seed===seed);
  if(chat) {
    currentChatPartner = chat.partner;

    if(chat.avatarUrl && chat.avatarUrl.startsWith('data:')) $('chatAvatar').innerHTML=`<img src="${chat.avatarUrl}" style="width:100%;height:100%;object-fit:cover">`;
    else $('chatAvatar').innerHTML=chat.avatarChar||'💬';
    $('mi').disabled=false; 
    $('sbtn').disabled=false;
    if(currentChatPartner) {
      let user = usersCache.get(currentChatPartner);
      if(user) {
        $('rightPanel').classList.remove('hidden');
        if(user.avatar && user.avatar.startsWith('data:')) $('panelAvatar').innerHTML=`<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover">`;
        else $('panelAvatar').innerHTML = currentChatPartner[0].toUpperCase();

        $('panelStatus').innerHTML = 'онлайн';
      }
    } else {
      $('rightPanel').classList.add('hidden');
    }
  }
  let msgs=messagesCache.get(seed);
  if(!msgs) { msgs=await loadMessages(seed); messagesCache.set(seed,msgs); }
  renderMessages(seed); 
  renderChatList(); 
  closeSB();
  if(pollInterval) clearInterval(pollInterval);
  pollInterval=setInterval(async()=>{
    let newMsgs=await loadMessages(seed); 
    let old=messagesCache.get(seed)||[];
    if(newMsgs.length !== old.length) { 
      messagesCache.set(seed,newMsgs); 
      renderMessages(seed);
      let chat2=chats.find(c=>c.seed===seed);
      if(chat2 && newMsgs.length > old.length) { 
        playNotificationSound();
        showToast(`📩 ${chat2.name}: новое сообщение`);
      }
    }
  },3000);
}

async function deleteChat(seed) {
  let chatIndex = chats.findIndex(c => c.seed === seed);
  if(chatIndex === -1) return;
  let chatName = chats[chatIndex].name;
  let partner = chats[chatIndex].partner;
  
  // Удаляем файл сообщений чата из Gist
  let fname = `chat_${CryptoJS.SHA256(seed).toString().slice(0,16)}.txt`;
  try {
    await gistPatch(GIST_ID, {[fname]: {content: ''}});
  } catch(e) { console.log('Ошибка удаления файла чата'); }
  
  // Удаляем чат у текущего пользователя
  chats.splice(chatIndex, 1);
  await saveUserData();
  
  // Удаляем чат у собеседника
  let allUsers = await loadUsers();
  let partnerUser = allUsers.find(u => u.username === partner);
  if(partnerUser && partnerUser.chats) {
    let partnerChatIndex = partnerUser.chats.findIndex(c => c.seed === seed);
    if(partnerChatIndex !== -1) {
      partnerUser.chats.splice(partnerChatIndex, 1);
      await saveUsers(allUsers);
      usersCache.set(partner, partnerUser);
    }
  }
  
  messagesCache.delete(seed);
  
  if(currentChatSeed === seed) {
    currentChatSeed = null;
    currentChatPartner = null;
    $('chatTitle').innerHTML = '—';
    $('chatAvatar').innerHTML = '💬';
    $('mi').disabled = true;
    $('sbtn').disabled = true;
    $('msgs').innerHTML = '<div style="text-align:center;opacity:0.5;padding:40px">💬 выберите чат</div>';
    $('rightPanel').classList.add('hidden');
    if(chats.length > 0) {
      await selectChat(chats[0].seed);
    }
  }
  
  renderChatList();
  showToast(`🗑️ чат "${chatName}" удалён у обоих собеседников`);
}

  let p=$('regPassword').value.trim(); 
  if(!u.match(/^[a-zA-Z0-9_]{3,20}$/)) { $('regMsg').innerText='❌ username 3-20 лат, цифры, _'; return; }

  if(users.find(x=>x.username===u)) { $('regMsg').innerText='❌ пользователь существует'; return; } 
  let hash=CryptoJS.SHA256(p).toString();

  $('regMsg').innerText='✅ регистрация OK, войдите'; 
  setTimeout(()=>{ document.querySelector('[data-tab="login"]').click(); },1200);

async function createChatWithUser() {
  let target=$('targetUser').value.trim().replace(/^@/,'');
  if(!target || target===currentUser.username) { showToast('укажите другого пользователя'); return; }
  await loadUsers();
  if(!usersCache.get(target)) { showToast('пользователь не найден'); return; }
  let existing=chats.find(c=>c.partner===target); 
  if(existing) { selectChat(existing.seed); closeNewChatModal(); return; }
  let seed=generateSeed();
  let targetUser = usersCache.get(target);

  let newChat={seed:seed, name:target, partner:target, lastMsg:'чат создан', avatarChar:target[0].toUpperCase(), avatarUrl:targetAvatar, lastSeen:Date.now(), muted:false};
  chats.push(newChat);

  if(targetUserObj) {

  showToast(`чат с @${target} создан`);

// Crop functions
function drawCropImage() {
  if(!cropCtx || !cropState.img) return;
  let w=400, h=400;
  cropCanvas.width=w; cropCanvas.height=h;
  cropCtx.clearRect(0,0,w,h);
  let imgW=cropState.img.width*cropState.zoom;
  let imgH=cropState.img.height*cropState.zoom;
  let x=cropState.panX+(w-imgW)/2;
  let y=cropState.panY+(h-imgH)/2;
  cropCtx.drawImage(cropState.img, x, y, imgW, imgH);
  if(cropState.showGrid) {
    cropCtx.beginPath();
    cropCtx.strokeStyle='rgba(0,245,212,0.5)';
    cropCtx.lineWidth=1;
    let steps=6;
    for(let i=1;i<steps;i++) {
      let posX=w*i/steps;
      cropCtx.moveTo(posX,0); cropCtx.lineTo(posX,h);
      let posY=h*i/steps;
      cropCtx.moveTo(0,posY); cropCtx.lineTo(w,posY);
    }
    cropCtx.stroke();
    cropCtx.beginPath();
    cropCtx.strokeStyle='rgba(0,245,212,0.8)';
    cropCtx.lineWidth=2;
    cropCtx.rect(0,0,w,h);
    cropCtx.stroke();
  }
}

function initCropEvents() {
  let canvas=$('cropCanvas');
  let isDragging=false, startX=0, startY=0, startPanX=0, startPanY=0;
  canvas.addEventListener('mousedown',(e)=>{
    isDragging=true; startX=e.clientX; startY=e.clientY;
    startPanX=cropState.panX; startPanY=cropState.panY;
    canvas.style.cursor='grabbing';
    e.preventDefault();
  });
  window.addEventListener('mousemove',(e)=>{
    if(!isDragging) return;
    let dx=e.clientX-startX; let dy=e.clientY-startY;
    cropState.panX=startPanX+dx; cropState.panY=startPanY+dy;
    drawCropImage();
  });
  window.addEventListener('mouseup',()=>{ isDragging=false; canvas.style.cursor='grab'; });
  canvas.style.cursor='grab';
  $('zoomSlider').oninput=(e)=>{ cropState.zoom=parseFloat(e.target.value); drawCropImage(); };
  $('gridToggleBtn').onclick=()=>{ cropState.showGrid=!cropState.showGrid; $('gridToggleBtn').classList.toggle('active',cropState.showGrid); drawCropImage(); };
}

function getCroppedImage() {
  return new Promise((resolve)=>{
    let w=400, h=400;
    let imgW=cropState.img.width*cropState.zoom;
    let imgH=cropState.img.height*cropState.zoom;
    let sx=-(cropState.panX+(w-imgW)/2);
    let sy=-(cropState.panY+(h-imgH)/2);
    let cropCanvas2=document.createElement('canvas');
    cropCanvas2.width=200; cropCanvas2.height=200;
    let ctx=cropCanvas2.getContext('2d');
    ctx.save();
    ctx.beginPath();
    ctx.arc(100,100,100,0,Math.PI*2);
    ctx.clip();
    let sourceX=sx/cropState.zoom;
    let sourceY=sy/cropState.zoom;
    let sourceW=200/cropState.zoom;
    let sourceH=200/cropState.zoom;
    ctx.drawImage(cropState.img, sourceX, sourceY, sourceW, sourceH, 0, 0, 200, 200);
    ctx.restore();
    resolve(cropCanvas2.toDataURL('image/png'));
  });
}

async function uploadAndCropAvatar(file) {
  let img=new Image();
  let reader=new FileReader();
  reader.onload=(e)=>{
    img.onload=()=>{
      cropState.img=img;
      cropState.zoom=1;
      cropState.panX=0;
      cropState.panY=0;
      cropState.showGrid=true;
      if(!cropCanvas){ cropCanvas=$('cropCanvas'); cropCtx=cropCanvas.getContext('2d'); initCropEvents(); }
      drawCropImage();
      $('cropEditor').style.display='block';
      $('profileAvatarPreview').style.display='none';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveProfile() { 
  let newName=$('profileUsername').value.trim(); 
  let bio=$('profileBio').value.trim(); 
  if(!newName.match(/^[a-zA-Z0-9_]{3,20}$/)) { $('profileMsg').innerText='некорректный username'; return; } 
  if(newName!==currentUser.username) { 
    let users=await loadUsers(); 
    if(users.find(u=>u.username===newName)) { $('profileMsg').innerText='имя занято'; return; } 
    let week=7*24*60*60*1000; 
    let lastChange=currentUser.lastNameChange||0; 
    if(Date.now()-lastChange<week) { $('profileMsg').innerText='менять username можно раз в неделю'; return; } 
    currentUser.lastNameChange=Date.now(); 
    currentUser.username=newName; 
  } 
  $('myUsername').innerText=newName; 
  currentUser.bio=bio; 
  await saveUserData(); 
  $('profileMsg').innerText='сохранено'; 
  setTimeout(()=>$('profileMsg').innerText='',2000); 
  closeProfileModal(); 
  await loadUserProfile(); 
}

// Event listeners
$('soundToggle').onclick = () => {
  soundEnabled = !soundEnabled;
  $('soundText').innerText = soundEnabled ? 'звук вкл' : 'звук выкл';
  $('soundToggle').style.opacity = soundEnabled ? '1' : '0.5';
};
$('fileBtn').onclick=()=>{ if(!currentChatSeed) return; $('fileInput').click(); };
$('fileInput').onchange=(e)=>{ if(e.target.files[0]) sendFile(e.target.files[0]); $('fileInput').value=''; };
$('chatHeaderInfo').onclick=()=>{ if(currentChatPartner) showUserProfile(currentChatPartner); };
$('closePanelBtn').onclick=()=>{ $('rightPanel').classList.add('hidden'); };
$('closeUserProfileBtn').onclick=()=>{ $('userProfileModal').classList.remove('on'); };
$('confirmDeleteBtn').onclick = () => { 
  if(deleteChatCallback) {
    deleteChatCallback(); 
    deleteChatCallback = null;
  }
  $('deleteChatModal').classList.remove('on'); 
};
$('cancelDeleteBtn').onclick = () => { 
  $('deleteChatModal').classList.remove('on'); 
  deleteChatCallback = null; 
};

function openNewChatModal() { $('newChatModal').classList.add('on'); $('targetUser').value=''; }
function closeNewChatModal() { $('newChatModal').classList.remove('on'); }
function openProfileModal() { $('profileModal').classList.add('on'); $('profileUsername').value=currentUser.username; $('profileBio').value=currentUser.bio||''; if(currentUser.avatar && currentUser.avatar.startsWith('data:')) $('profileAvatarPreview').innerHTML=`<img src="${currentUser.avatar}" style="width:100%;height:100%;object-fit:cover">`; else $('profileAvatarPreview').innerHTML=currentUser.username[0].toUpperCase(); $('cropEditor').style.display='none'; $('profileAvatarPreview').style.display='flex'; }
function closeProfileModal() { $('profileModal').classList.remove('on'); }
function openSB() { $('sidebar').classList.add('mopen'); $('movl').classList.add('on'); }
function closeSB() { $('sidebar').classList.remove('mopen'); $('movl').classList.remove('on'); }

document.querySelectorAll('.tbtn').forEach(btn=>{ btn.onclick=()=>{ let tab=btn.getAttribute('data-tab'); $('loginPanel').style.display=tab==='login'?'block':'none'; $('registerPanel').style.display=tab==='register'?'block':'none'; document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('on',b===btn)); }; });
$('doLoginBtn').onclick=doLogin; $('doRegBtn').onclick=doReg;
$('loginPassword').addEventListener('keypress',e=>{ if(e.key==='Enter') doLogin(); });
$('newChatBtn').onclick=openNewChatModal; $('createChatConfirm').onclick=createChatWithUser;
$('cancelChatBtn').onclick=closeNewChatModal; $('settingsBtn').onclick=openProfileModal;
$('saveProfileBtn').onclick=saveProfile; $('closeProfileBtn').onclick=closeProfileModal;
$('backBtn').onclick=openSB; $('movl').onclick=closeSB;
$('sbtn').onclick=sendMsg;
$('mi').addEventListener('keypress',e=>{ if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
</script>
